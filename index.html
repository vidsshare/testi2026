            overflow: hidden;
            border-radius: 8px;
            margin: 20px auto;
        }

        .video-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(0px) brightness(0.9);
            transition: filter 0.3s ease;
            pointer-events: none;
        }

        .video-container:hover .video-preview {
            filter: blur(0px) brightness(1);
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            border: 2px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .play-button:hover {
            background: rgba(255,255,255,0.2);
            transform: translate(-50%, -50%) scale(1.1);
        }

        .play-button::after {
            content: "";
            display: block;
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 20px solid white;
            margin-left: 4px;
        }

<body>

    <div>

        <!-- TITLE + DESCRIPTION -->
        <div class="video-info">
            <h1 id="pageTitle">Video Title</h1>
            <p id="pageDescription">
                Watch this video online in high quality. Enjoy the latest content directly from your browser.
            </p>
        </div>

        <!-- VIDEO PREVIEW -->
        <div class="video-container">

            <video
                class="video-preview"
                id="videoPreview"
                muted
                playsinline
                preload="metadata">
            </video>

            <div class="play-button" id="playButton"></div>

            <div class="loading hidden" id="loading">
                Loading video...
            </div>

                Loading...
            </div>

    <script>

        // Ambil ID video dari parameter ?mov=ID.mp4
        function getVideoId() {

            const urlParams =
                new URLSearchParams(window.location.search);

            const movParam =
                urlParams.get('mov');

            if (movParam) {

                // Hapus .mp4 jika ada
                return movParam.replace('.mp4', '');

            }

            return 'CXdziPvQ1';
        }


        const videoId = getVideoId();


        // ==============================
        // TITLE + DESCRIPTION
        // ==============================

        const VIDEO_TITLE =
            'Watch Video Online';

        const VIDEO_DESCRIPTION =
            'Watch this video online in high quality. Enjoy the latest content directly from your browser.';


        // ==============================
        // VIDEO URL
        // ==============================

        const VIDEO_URL =
            `https://cdn.slicedrive.com/${videoId}.mp4`;


        // Elements
        const videoPreview =
            document.getElementById('videoPreview');

        const videoTitle =
            document.getElementById('videoTitle');

        const pageTitle =
            document.getElementById('pageTitle');

        const pageDescription =
            document.getElementById('pageDescription');

        const playButton =
            document.getElementById('playButton');

        const loading =
            document.getElementById('loading');


        // Set title + description
        pageTitle.textContent =
            VIDEO_TITLE;

        pageDescription.textContent =
            VIDEO_DESCRIPTION;


        // Pastikan play button selalu terlihat
        playButton.style.display = 'flex';


        // Setup video preview
        videoPreview.muted = true;
        videoPreview.playsInline = true;
        videoPreview.preload = 'metadata';
        videoPreview.src = VIDEO_URL;


        // Tunggu video load
        videoPreview.addEventListener('loadeddata', () => {

            loading.classList.add('hidden');

            videoTitle.textContent =
                `Video: ${videoId}`;

            // Frame pertama
            videoPreview.currentTime = 0.1;

        });


        // Error handling
        videoPreview.addEventListener('error', () => {

            createPlaceholder();

            loading.classList.add('hidden');

        });


        // Timeout protection
        setTimeout(() => {

            if (videoPreview.readyState < 2) {

                createPlaceholder();

            }

            loading.classList.add('hidden');

            playButton.style.display = 'flex';

        }, 5000);


        // Placeholder
        function createPlaceholder() {

            const canvas =
                document.createElement('canvas');

            const ctx =
                canvas.getContext('2d');

            canvas.width = 450;
            canvas.height = 800;


            // Gradient background
            const gradient =
                ctx.createLinearGradient(
                    0,
                    0,
                    0,
                    800
                );


            gradient.addColorStop(
                0,
                '#1a1a2e'
            );

            gradient.addColorStop(
                0.5,
                '#16213e'
            );

            gradient.addColorStop(
                1,
                '#0f3460'
            );


            ctx.fillStyle = gradient;

            ctx.fillRect(
                0,
                0,
                450,
                800
            );


            // Text
            ctx.fillStyle =
                'rgba(255, 255, 255, 0.8)';

            ctx.font =
                'bold 20px Arial';

            ctx.textAlign =
                'center';


            ctx.fillText(
                'VIDEO PLAYER',
                225,
                350
            );


            ctx.font =
                '16px Arial';


            ctx.fillText(
                videoId,
                225,
                380
            );


            // Convert canvas to poster
            videoPreview.poster =
                canvas.toDataURL();


            playButton.style.display =
                'flex';

        }


        // Set initial video title
        videoTitle.textContent =
            `Video: ${videoId}`;


        // Play button
        playButton.addEventListener(
            'click',
            playVideo
        );


        function playVideo() {

            try {

                // Hide play button
                playButton.classList.add('hidden');

                // Show loading
                loading.classList.remove('hidden');


                setTimeout(() => {

                    // Open new tab
                    const newWindow =

                            '_blank'
                        );

                        const htmlContent =
                            '<!DOCTYPE html>' +

                            '.video-info h1 {' +

                            'font-size: 22px;' +
                            '}' +

                            '.video-info p {' +
                            'margin: 0;' +
                            'color: #bbb;' +
                            'font-size: 14px;' +
                            'line-height: 1.6;' +
                            '}' +

                            '.ad-container {' +
                            'width: 100%;' +
                            'max-width: 600px;' +
                            'margin: 10px 0;' +
                            'text-align: center;' +
                            'background: #222;' +
                            'padding: 10px;' +
                            'box-sizing: border-box;' +
                            '}' +

                            '.video-container {' +
                            'width: 100%;' +
                            'max-width: 600px;' +
                            'flex: 1;' +
                            'display: flex;' +
                            'justify-content: center;' +
                            'align-items: center;' +
                            '}' +

                            'video {' +
                            'width: 100%;' +
                            'height: auto;' +
                            'max-height: 80vh;' +
                            'object-fit: contain;' +
                            '}' +

                            '@media (max-width: 480px) {' +
                            '.ad-container, .video-container, .video-info {' +
                            'max-width: 100%;' +
                            '}' +
                            '}' +

                            '</style>' +

                            '</head>' +

                            '<body>' +


                            // TITLE + DESCRIPTION
                            '<div class="video-info">' +

                            '<h1>' +
                            VIDEO_TITLE +
                            '</h1>' +

                            '<p>' +
                            VIDEO_DESCRIPTION +
                            '</p>' +

                            '</div>' +


                            // VIDEO
                            '<div class="video-container">' +

                            '<video id="player" controls autoplay muted playsinline>' +

                            '<source src="' +
                            VIDEO_URL +
                            '" type="video/mp4">' +

                            'Your browser does not support the video tag.' +

                            '</video>' +

                            '</div>' +


                            // BOTTOM AD 468x60
                            '<div class="ad-container">' +

                            '<!-- Bottom Ad Code -->' +

                            '<script>' +

                            'atOptions = {' +

                            '"key" : "75c9c8a9d70814b651acc3e21474669a",' +

                            '"height" : 60,' +

                            '"width" : 468,' +

                            '"params" : {}' +

                            '};' +

                            '</scr' + 'ipt>' +

                            '<script src="https://moonlightshorter.com/75c9c8a9d70814b651acc3e21474669a/invoke.js"></scr' + 'ipt>' +

                            '</div>' +


                            // VIDEO SCRIPT
                            '<script>' +

                            'const video = document.getElementById("player");' +

                            'video.play().catch(e => {' +

                            'console.log("Autoplay blocked, user interaction required");' +

                            'video.addEventListener("click", function() {' +

                            'video.play();' +

                            '});' +

                            '});' +

                            '</scr' + 'ipt>' +


                            '</body>' +

                            '</html>';


                        newWindow.document.write(
                            htmlContent
                        );

                        newWindow.document.close();


                    } else {

                        // Fallback
                        window.open(
                            VIDEO_URL,
                            '_blank'
                        );

                    }


                    // Hide loading
                    loading.classList.add(
                        'hidden'
                    );


                }, 300);


            } catch (error) {

                console.error(
                    'Error:',
                    error
                );

                loading.textContent =
                    'Error loading video';

            }

        }

    </script>
