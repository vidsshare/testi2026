<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VIDEO TITLE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 10px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .video-wrapper {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    /* VIDEO TITLE */
    .video-title {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      margin: 0 0 8px;
    }

    /* VIDEO DESCRIPTION */
    .video-description {
      font-size: 15px;
      line-height: 1.6;
      color: #bbb;
      margin: 0 0 18px;
    }

    /* VIDEO PLAYER */
    .video-player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      border-radius: 6px;
    }

    .video-player video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    /* NATIVE BANNER */
    .native-banner {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 6px;
      overflow: hidden;
      text-align: center;
    }

    .native-banner-label {
      font-size: 10px;
      color: #777;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .native-banner-content {
      width: 100%;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* MOBILE */
    @media (max-width: 600px) {

      body {
        padding: 15px 8px;
      }

      .video-title {
        font-size: 20px;
      }

      .video-description {
        font-size: 14px;
      }

      .native-banner {
        margin-top: 14px;
        padding: 8px;
      }
    }
  </style>
</head>
