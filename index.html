<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>NextWatchVidio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      min-height: 100vh;
      background: #09080e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #f3f0f7;
      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 16px 12px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* HEADER */
    .header {
      text-align: center;
      padding: 12px 0 6px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #d4af37; /* Gold accent */
      text-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
    }

    .logo span {
      color: #a855f7;
    }

    .sub {
      margin-top: 6px;
      color: #9ca3af;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #a855f7;
      margin: 10px auto 0;
      border-radius: 2px;
      opacity: 0.6;
    }

    /* VIDEO CARD CONTAINER */
    .video-card {
      background: #110f18;
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* VIDEO BOX & ASPECT RATIO */
    .video-box {
      position: relative;
      background: #000;
      width: 100%;
      aspect-ratio: 16 / 9; /* Rasio standar video */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #videoLoader {
      position: absolute;
      inset: 0;
      background: #0f0d15;
      color: #d4af37;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      z-index: 10;
    }

    /* VIDEO INFO */
    .video-info {
      padding: 16px;
    }

    .video-title {
      font-size: 18px;
      font-weight: 800;
      color: #f3f0f7;
    }

    .video-desc {
      margin-top: 8px;
      color: #9ca3af;
      font-size: 12.5px;
      line-height: 1.5;
    }

    .stats {
      display: flex;
      gap: 6px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .stats div {
      padding: 5px 10px;
      border: 1px solid rgba(212, 175, 55, 0.25);
      background: rgba(212, 175, 55, 0.05);
      color: #f3f0f7;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 600;
    }

    /* SMARTLINK BUTTON */
    .smartlink-wrap {
      width: 100%;
    }

    .smartlink-btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, #a855f7, #6b21a8);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      transition: transform 0.2s, opacity 0.2s;
    }

    .smartlink-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    /* TRENDING SECTION */
    .section-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #d4af37;
      margin-top: 4px;
    }

    /* NATIVE BANNER AD 2 (DIBAWAH) */
    .video-native-ad {
      position: relative;
      display: block;
      width: 100%;
      min-height: 80px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: #110f18;
      text-align: center;
      overflow: hidden;
    }
