<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VIDEO TITLE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 10px;
      background: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .video-wrapper {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    /* =========================
       VIDEO TITLE
    ========================== */

    .video-title {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      margin: 0 0 8px;
    }

    /* =========================
       VIDEO DESCRIPTION
    ========================== */

    .video-description {
      font-size: 15px;
      line-height: 1.6;
      color: #bbb;
      margin: 0 0 18px;
    }

    /* =========================
       VIDEO PLAYER
    ========================== */

    .video-player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      border-radius: 6px;
    }

    .video-player video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    /* =========================
       CENTER PLAY BUTTON
    ========================== */

    .center-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      width: 76px;
      height: 76px;

      padding: 0;
      border: 0;
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.95);
      color: #111;

      font-size: 30px;
      line-height: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
      z-index: 10;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .center-play span {
      margin-left: 5px;
    }

    .center-play:hover {
      transform: translate(-50%, -50%) scale(1.08);
    }

    .center-play.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* =========================
       NATIVE BANNER
    ========================== */

    .native-banner {
      width: 100%;
      margin-top: 18px;
      padding: 12px;

      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 6px;

      text-align: center;
      overflow: hidden;
    }

    .native-banner-label {
      font-size: 10px;
      color: #777;
      margin-bottom: 8px;

      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .native-banner-content {
      width: 100%;
      min-height: 90px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      body {
        padding: 15px 8px;
      }

      .video-title {
        font-size: 20px;
      }

      .video-description {
        font-size: 14px;
      }

      .center-play {
        width: 62px;
        height: 62px;
        font-size: 25px;
      }

      .native-banner {
        margin-top: 14px;
        padding: 8px;
      }
    }
  </style>
</head>

<body>

  <div class="video-wrapper">

    <!-- =========================
         VIDEO TITLE
    ========================== -->

    <div class="video-title">
      VIDEO TITLE
    </div>


    <!-- =========================
         VIDEO DESCRIPTION
    ========================== -->

    <div class="video-description">
      Video description goes here. Watch this video online in high quality.
    </div>


    <!-- =========================
         VIDEO PLAYER
    ========================== -->

    <div class="video-player" id="videoContainer">

      <video
        id="videoPlayer"
        controls
        playsinline
        preload="metadata"
        poster="https://cdn.aceimg.com/FE4W6dWaV.png">

        <source
          src="https://qu.ax/QoWaO.mp4"
          type="video/mp4">

        Browser Anda tidak mendukung pemutar video.

      </video>


      <!-- CENTER PLAY BUTTON -->

      <button
        class="center-play"
        id="playButton"
        type="button"
        aria-label="Play video">

        <span>▶</span>

      </button>

    </div>
