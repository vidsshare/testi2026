<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Layout - Stylized Text</title>
  <!-- Mengimpor Font Google (Poppins) untuk tampilan modern -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
      background-color: #0f172a; /* Latar belakang gelap agar warna judul menonjol */
    }

    .video-card {
      width: 100%;
      max-width: 600px;
      border: 2px solid #1e293b;
      border-radius: 12px;
      background-color: #1e293b;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* === HEADER SECTION (JUDUL & DESKRIPSI BERWARNA) === */
    .header-section {
      padding: 20px;
      text-align: center;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      border-bottom: 2px solid #334155;
    }

    /* Judul dengan Gradient Teks Berwarna & Glow */
    .header-section h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ff416c, #ff4b2b, #ffb347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(255, 65, 108, 0.3);
      margin-bottom: 8px;
    }

    /* Deskripsi dengan Warna Cerah & Latar Soft Badge */
    .header-section p {
      font-size: 0.95rem;
      font-weight: 400;
      color: #38bdf8; /* Warna cyan/biru terang */
      line-height: 1.5;
      background: rgba(56, 189, 248, 0.08);
      padding: 8px 14px;
      border-radius: 6px;
      display: inline-block;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    /* Video Player Container */
    .player-section {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* Rasio 16:9 */
      background-color: #000;
      border-bottom: 2px solid #334155;
    }

    .player-section iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }

    /* Overlay Iklan di Atas Video */
    .video-ad-overlay {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 468px;
      background-color: rgba(15, 23, 42, 0.9);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      z-index: 10;
      border: 1px solid #334155;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
    }

    .close-ad-btn {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Iklan Native Banner Bawah */
    .ad-section {
      padding: 15px;
      text-align: center;
      background-color: #0f172a;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 2px solid #334155;
      color: #94a3b8;
      font-weight: 600;
    }

    /* Button More Videos */
    .more-videos-section {
      padding: 15px;
      text-align: center;
      background-color: #1e293b;
    }

    .btn-more-videos {
      display: inline-block;
      width: 100%;
      padding: 12px 20px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-more-videos:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(168, 85, 247, 0.5);
    }
  </style>
</head>
<body>

  <div class="video-card">
    <!-- Header dengan Judul & Deskripsi Berwarna -->
    <div class="header-section">
      <h1>🔥 AMAZING VIDEO TITLE</h1>
      <p>✨ Watch this trending video to explore awesome content and tips!</p>
    </div>

    <!-- Video Player + Ad Overlay -->
    <div class="player-section">
      <iframe 
        src="https://qu.ax/QoWaO.mp4" 
        title="Video Player" 
        allowfullscreen>
      </iframe>

      <!-- Ad Overlay di atas video -->
      <div class="video-ad-overlay" id="adOverlay">
        <button class="close-ad-btn" onclick="document.getElementById('adOverlay').style.display='none'">✕</button>
        <a href="https://example.com" target="_blank" style="color: #facc15; text-decoration: none; font-weight: 600;">
          📢 Special Offer! Click here to claim your reward.
        </a>
      </div>
    </div>

    <!-- Iklan Native Banner Bawah -->
    <div class="ad-section">
      <div>IKLAN NATIVE BANNER</div>
    </div>

    <!-- Tombol More Videos -->
    <div class="more-videos-section">
      <a href="#" class="btn-more-videos">MORE VIDEOS</a>
    </div>
  </div>

</body>
</html>
